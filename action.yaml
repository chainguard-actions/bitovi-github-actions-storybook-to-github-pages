name: 'Deploy Storybook to GitHub Pages'
description: 'Build and deploy storybook code to GitHub pages'
branding:
  icon: upload-cloud
  color: red
inputs:
  checkout:
    description: 'Specifies if this action should checkout the code'
    required: false
    default: 'true'
  path:
    description: 'Specifies the path of the static assets after building'
    required: false
    # TODO: where does storybook output by default?
    default: 'dist/storybook'
  build_command:
    description: 'Specifies the command to run after npm ci for the build'
    required: false
    # TODO: yarn?  npm run build (instead of build-storybook)?
    default: 'npm run build-storybook'
outputs:
  page_url:
    description: "The URL of the page"
    value: ${{ steps.deploy.outputs.page_url }}
runs:
  using: 'composite'
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Checkout if required
      if: ${{ inputs.checkout == 'true' }}
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
    - name: 'Build'
      shell: bash
      env:
        BUILD_COMMAND: ${{ inputs.build_command }}
      run: |
        echo "::group::Build"
        npm ci
        _build_script="$(mktemp)"
        printf '%s\n' "$BUILD_COMMAND" > "$_build_script"
        bash -eo pipefail "$_build_script"
        echo "::endgroup::"
    - name: 'upload'
      uses: actions/upload-pages-artifact@a597aecd27af1cf14095ccaa29169358e3d91e28 # v1.0.4
      with:
        path: ${{ inputs.path }}
    - id: deploy
      name: Deploy to GitHub Pages
      uses: actions/deploy-pages@f27bcc15848fdcdcc02f01754eb838e44bcf389b # v1
      with:
        token: ${{ github.token }}
