name: Test basic build with custom commands
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # GitHub Pages deploy permissions (required by deploy-pages action)
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake build output directory so upload-pages-artifact has something to upload
      - name: Prepare fake build output
        run: |
          mkdir -p dist/storybook
          echo "<html><body>Storybook</body></html>" > dist/storybook/index.html

      - id: action
        name: Run action with custom build commands
        uses: .
        with:
          checkout: 'false'
          install_command: 'echo "install skipped"'
          build_command: 'echo "build skipped"'
          path: 'dist/storybook'
        continue-on-error: true

      - name: Assert build commands ran (action attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail at deploy-pages (no real Pages env in act),
          # but it should not fail before reaching that step.
          # We accept 'success' or 'failure' (from deploy step), but not a
          # setup/build error which would also be 'failure'.
          # Since we can't distinguish, we just verify the step ran.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
