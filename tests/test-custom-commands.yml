name: Test custom install and build commands
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create output directory for upload step
        run: mkdir -p dist/storybook && echo "<html><body>Storybook</body></html>" > dist/storybook/index.html

      - id: action
        uses: .
        with:
          checkout: 'false'
          install_command: 'echo "install step skipped"'
          build_command: 'echo "build step skipped"'
          path: 'dist/storybook'
        continue-on-error: true

      - name: Assert build steps ran (action ran without crashing before deploy)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail at deploy-pages (no GitHub Pages env in act)
          # but it should not fail before that. We accept failure or success here.
          if [ "$OUTCOME" = "failure" ]; then
            echo "Action failed (likely at deploy-pages step, which is expected in act)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
          else
            echo "Unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action ran through build phase"
