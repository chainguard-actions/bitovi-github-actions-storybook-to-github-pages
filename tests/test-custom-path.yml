name: Test custom output path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare marker files
        run: |
          mkdir -p /tmp/custom-path-test
          echo "not-run" > /tmp/custom-path-test/install.txt
          echo "not-run" > /tmp/custom-path-test/build.txt

      - id: action
        uses: .
        with:
          checkout: 'false'
          path: 'custom/output/path'
          install_command: >-
            mkdir -p custom/output/path &&
            echo "custom-install-ran" > /tmp/custom-path-test/install.txt &&
            echo "<html>storybook</html>" > custom/output/path/index.html
          build_command: 'echo "custom-build-ran" > /tmp/custom-path-test/build.txt'
        continue-on-error: true

      - name: Assert install command ran
        run: |
          INSTALL_RESULT=$(cat /tmp/custom-path-test/install.txt 2>/dev/null || echo "not-run")
          echo "install result: $INSTALL_RESULT"
          if [ "$INSTALL_RESULT" != "custom-install-ran" ]; then
            echo "FAIL: install command did not run, got: $INSTALL_RESULT"
            exit 1
          fi
          echo "PASS: install command ran"

      - name: Assert build command ran
        run: |
          BUILD_RESULT=$(cat /tmp/custom-path-test/build.txt 2>/dev/null || echo "not-run")
          echo "build result: $BUILD_RESULT"
          if [ "$BUILD_RESULT" != "custom-build-ran" ]; then
            echo "FAIL: build command did not run, got: $BUILD_RESULT"
            exit 1
          fi
          echo "PASS: build command ran"

      - name: Assert custom output directory was created
        run: |
          if [ ! -f custom/output/path/index.html ]; then
            echo "FAIL: custom/output/path/index.html not found"
            exit 1
          fi
          echo "PASS: custom output path was used"
